name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Liens & images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les liens relatifs et les images locales
        run: python3 scripts/check_links.py

  secrets:
    name: Flags & secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuser les flags en clair, clés privées et fichiers de credentials
        run: python3 scripts/check_secrets.py

  drafts:
    name: Writeups publiés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Échouer si un writeup de main est encore en brouillon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/check_drafts.py
      - name: Signaler les brouillons sur une PR
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python3 scripts/check_drafts.py --warn-only

  index:
    name: Index à jour
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier que l'index a été régénéré
        run: python3 scripts/update_index.py --check

  structure:
    name: Structure des writeups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider l'arborescence et le frontmatter
        run: python3 scripts/check_frontmatter.py

  cours:
    name: Cours protégés
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Récupérer la branche de base
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Refuser une modification de cours/ hors mainteneur
        run: python3 scripts/check_cours_protection.py --actor "${{ github.actor }}" --base "origin/${{ github.base_ref }}"
