name: Site (GitHub Pages)

# Publie les writeups et les cours en site statique (mkdocs-material) :
# recherche intégrée, sommaire par machine, plan du site pour les moteurs.
# Le site est reconstruit à chaque modification de Markdown sur main.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/build_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer mkdocs-material
        run: pip install "mkdocs-material>=9.5"
      - name: Assembler les pages et la navigation
        run: python3 scripts/build_docs.py
      - name: Générer le site
        run: mkdocs build --config-file build/mkdocs.yml --site-dir "$PWD/site"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
