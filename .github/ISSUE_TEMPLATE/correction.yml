name: Signaler une erreur (writeup ou cours)
description: Une commande fausse, un lien mort, une explication incomplète, une coquille.
title: "[Correction] <fichier ou épreuve>"
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Pour un writeup, une PR directe est encore plus rapide.
        Pour `cours/`, **ne pas ouvrir de PR** : cet espace est réservé aux mainteneurs, cette issue est le bon canal.
  - type: input
    id: page
    attributes:
      label: Fichier ou page concernée
      placeholder: writeups/hackropole.fr/Challenges/crypto/a-laise/README.md
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui est faux ou manquant
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction proposée
      description: Le texte ou la commande exacte, avec une source si possible.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: documentation, RFC, article, capture…
    validations:
      required: false
